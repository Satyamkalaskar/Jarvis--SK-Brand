name: Build JARVIS.exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install SpeechRecognition pyaudio pyautogui psutil pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --name JARVIS jarvis_gui.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-exe
          path: dist/JARVIS.exe
